<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <script>
    // Redireciona 404 para index.html mantendo o path
    // Necessário para SPAs no GitHub Pages
    (function() {
      var path = window.location.pathname;
      var base = '/convite-15-anos';
      
      // Se o path é exatamente a raiz do projeto, não fazer nada
      // GitHub Pages servirá index.html automaticamente
      if (path === base + '/' || path === base + '/index.html') {
        // Deixar como está - GitHub Pages servindo index.html
        return;
      }
      
      // Se é uma subrota desconhecida, redirecionar para a raiz
      if (path.startsWith(base + '/')) {
        window.location.replace(base + '/');
      }
    })();
  </script>
</head>
<body>
  <p>Carregando...</p>
</body>
</html>
